<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Log in to i-ready Connect</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #1a1a2e, #0c0c14);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 40px;
}

.container {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 40px;
}

.card {
    width: 200px;
    padding: 25px;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: 0.2s;
    cursor: pointer;
    font-size: 1.1rem;
}

.card:hover {
    transform: scale(1.08);
    background: rgba(123,91,255,0.3);
}

  /* COOL HOME BUTTON */
.home-button {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 999;

    padding: 10px 18px;
    border-radius: 999px;

    background: linear-gradient(135deg, #ff5b77, #7b5bff);
    color: white;
    text-decoration: none;
    font-weight: 700;
    letter-spacing: 0.05em;

    box-shadow: 0 10px 25px rgba(123, 91, 255, 0.4);
    transition: 0.25s ease;

    display: inline-flex;
    align-items: center;
    gap: 8px;
}
.card img {
    width: 70px;
    height: 70px;
    object-fit: contain;
    margin-bottom: 10px;
}

.card p {
    margin: 0;
    font-weight: bold;
}
body {
    cursor: none;
}

a, button, .cool-button, div {
    cursor: none !important;
}

/* cursor */
.cursor {
    width: 14px;
    height: 14px;
    background: #7b5bff;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    box-shadow: 0 0 25px #7b5bff;
}

/* trail */
.trail {
    width: 8px;
    height: 8px;
    background: rgba(123,91,255,0.6);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    animation: fadeOut 0.6s forwards;
    z-index: 9998;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        transform: scale(0.3);
    }
}

/* ripple */
.ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid rgba(123,91,255,0.8);
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%);
    animation: rippleAnim 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 9997;
}

@keyframes rippleAnim {
    to {
        width: 80px;
        height: 80px;
        opacity: 0;
    }
}
</style>
</head>

<body>
    <div class="cursor"></div>


<a class="home-button" href="index.html">🏠Home</a>

<h1>🎵 Music</h1>

<div class="container">

<div class="card" onclick="openSite('https://open.spotify.com')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg">
    <p>Spotify</p>
</div>

<div class="card" onclick="openSite('https://music.youtube.com')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Youtube_Music_icon.svg">
    <p>YouTube Music</p>
</div>

<div class="card" onclick="openSite('https://soundcloud.com')">
    <img src="https://img.freepik.com/premium-vector/soundcloud-logo_578229-231.jpg?semt=ais_hybrid&w=740&q=80">
    <p>SoundCloud</p>
</div>
</div>

<script>
function openSite(url) {
    window.open(url, "_self");
}
</script>
<script>
const cursor = document.querySelector(".cursor");

// move cursor
document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";

    const trail = document.createElement("div");
    trail.className = "trail";
    trail.style.left = e.clientX + "px";
    trail.style.top = e.clientY + "px";
    document.body.appendChild(trail);

    setTimeout(() => trail.remove(), 600);
});

// click ripple
document.addEventListener("click", (e) => {
    const ripple = document.createElement("div");
    ripple.className = "ripple";
    ripple.style.left = e.clientX + "px";
    ripple.style.top = e.clientY + "px";
    document.body.appendChild(ripple);

    setTimeout(() => ripple.remove(), 600);
});
</script>
</script>

</body>
</html>
