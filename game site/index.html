<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i-Ready Login | Log in to i-ready Connect</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1a1a2e, #0c0c14);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    cursor: none;
}

/* CLOCK */
#clock {
    margin-bottom: 20px;
    font-size: 1.2rem;
}

/* BUTTONS */
.page-container {
    text-align: center;
}

.cool-button {
    display: inline-block;
    padding: 18px 44px;
    margin: 10px;
    color: #fff;
    background: linear-gradient(135deg, #ff5b77 0%, #7b5bff 100%);
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.2s;
}

.cool-button:hover {
    transform: scale(1.05);
}

/* HOME BUTTON */
.home-button {
    position: fixed;
    top: 18px;
    left: 18px;
    padding: 10px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff5b77, #7b5bff);
    color: white;
    text-decoration: none;
    font-weight: 700;
}

/* CURSOR */
.cursor {
    width: 14px;
    height: 14px;
    background: #7b5bff;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    box-shadow: 0 0 25px #7b5bff;
}

/* TRAIL */
.trail {
    width: 8px;
    height: 8px;
    background: rgba(123,91,255,0.6);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    animation: fadeOut 0.6s forwards;
    z-index: 9998;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        transform: scale(0.3);
    }
}

/* RIPPLE */
.ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid rgba(123,91,255,0.8);
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%);
    animation: rippleAnim 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 9997;
}

@keyframes rippleAnim {
    to {
        width: 80px;
        height: 80px;
        opacity: 0;
    }
}
/* base background */
.bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, #0f1020, #070812);
    z-index: -10;
}

/* ===== GLOW BLOBS ===== */
.blob {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(140px);
    opacity: 0.6;
    mix-blend-mode: screen;
    animation: drift 18s infinite ease-in-out;
}

.b1 { background: #7b5bff; top: 10%; left: 15%; }
.b2 { background: #ff4d6d; top: 60%; left: 70%; animation-delay: 3s; }
.b3 { background: #00d4ff; top: 40%; left: 35%; animation-delay: 6s; }

@keyframes drift {
    0% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px,-50px) scale(1.15); }
    100% { transform: translate(0,0) scale(1); }
}

/* ===== ANIMATED GRID ===== */
.grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(60deg);
    transform-origin: center;
    animation: gridMove 10s linear infinite;
    opacity: 0.25;
    z-index: -8;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 0 60px;
    }
}

/* ===== SCANLINES ===== */
.scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 3px,
        transparent 6px
    );
    z-index: -7;
    pointer-events: none;
    animation: scanMove 6s linear infinite;
    opacity: 0.3;
}

@keyframes scanMove {
    from { transform: translateY(0); }
    to { transform: translateY(20px); }
}
/* particle canvas layer */
#particles {
    position: fixed;
    inset: 0;
    z-index: -6;
    pointer-events: none;
}
</style>
</head>

<body>
    <canvas id="particles"></canvas>
<div class="bg"></div>

<div class="grid"></div>
<div class="scanlines"></div>

<div class="cursor"></div>

<a class="home-button" href="index.html">🏠 Home</a>

<div id="clock"></div>

<div class="page-container">
    <h1>Artics Games</h1>

    <a class="cool-button" href="games.html">🎮 Games</a>
    <a class="cool-button" href="music.html">🎵 Music</a>
    <a class="cool-button" href="movies.html">🎬 Movies</a>
</div>

<script>
// CLOCK
function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerHTML =
        now.toLocaleDateString() + " | " + now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// CURSOR + TRAIL
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";

    const trail = document.createElement("div");
    trail.className = "trail";
    trail.style.left = e.clientX + "px";
    trail.style.top = e.clientY + "px";
    document.body.appendChild(trail);

    setTimeout(() => trail.remove(), 600);
});

// RIPPLE
document.addEventListener("click", (e) => {
    const ripple = document.createElement("div");
    ripple.className = "ripple";
    ripple.style.left = e.clientX + "px";
    ripple.style.top = e.clientY + "px";
    document.body.appendChild(ripple);

    setTimeout(() => ripple.remove(), 600);
});
</script>
<script>
document.querySelectorAll("a, button").forEach(el => {
    el.style.cursor = "none";
});
</script>
<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particlesArray = [];

const numParticles = 80;

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
    }

    update() {
        this.x += this.speedX;
        this.y += this.speedY;

        // wrap around screen
        if (this.x > canvas.width) this.x = 0;
        if (this.x < 0) this.x = canvas.width;
        if (this.y > canvas.height) this.y = 0;
        if (this.y < 0) this.y = canvas.height;
    }

    draw() {
        ctx.fillStyle = "rgba(123, 91, 255, 0.6)";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#7b5bff";

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function init() {
    for (let i = 0; i < numParticles; i++) {
        particlesArray.push(new Particle());
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
    }

    requestAnimationFrame(animate);
}

init();
animate();

// resize fix
window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</script
