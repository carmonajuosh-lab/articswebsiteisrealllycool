body {
    margin: 0;

}

/* ===== BACKGROUND LAYERS ===== */
#particles, #grid, #scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

#particles {
    z-index: 0;
}

#grid {
    z-index: 1;
    background-image:
        linear-gradient(rgba(123,91,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,91,255,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 12s linear infinite;
    opacity: 0.5;
}

@keyframes gridMove {
    from { transform: translateY(0); }
    to { transform: translateY(60px); }
}

#scanlines {
    z-index: 2;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02),
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 4px
    );
    opacity: 0.25;
}

/* ===== CONTENT ===== */
.page-shell {
    position: relative;
    z-index: 5;
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.page-header {
    text-align: center;
}

.page-header h1 {
    font-size: 3rem;
    letter-spacing: 5px;
    margin: 0;
}

#searchBar {
    width: 100%;
    max-width: 420px;
    padding: 12px;
    margin-top: 20px;
    border-radius: 999px;
    border: none;
    text-align: center;
    background: rgba(255,255,255,0.08);
    color: white;
}

/* GRID */
.game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 260px));
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

/* CARD */
.game-card {
    border-radius: 18px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    transition: 0.25s;
}

.game-card:hover {
    transform: translateY(-6px) scale(1.02);
}

.game-thumbnail img {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.game-label {
    padding: 10px;
    text-align: center;
    font-weight: bold;
}

/* HOME */
.home-button {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    padding: 10px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg,#ff5b77,#7b5bff);
    color: white;
    text-decoration: none;
}

/* ===== CURSOR ===== */
.cursor {
    width: 14px;
    height: 14px;
    background: #7b5bff;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    box-shadow: 0 0 20px #7b5bff;
}

.trail {
    width: 8px;
    height: 8px;
    background: rgba(123,91,255,0.6);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    animation: fadeOut 0.6s forwards;
}

@keyframes fadeOut {
    to { opacity: 0; transform: scale(0.3); }
}

.ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid rgba(123,91,255,0.8);
    width: 10px;
    height: 10px;
    animation: rippleAnim 0.6s ease-out forwards;
}

@keyframes rippleAnim {
    to { width: 80px; height: 80px; opacity: 0; }
}
</style>

<script>
/* SEARCH */
const searchBar = document.getElementById("searchBar");
const cards = document.querySelectorAll(".game-card");

searchBar.addEventListener("input", () => {
    const v = searchBar.value.toLowerCase();
    cards.forEach(c => {
        c.style.display = c.innerText.toLowerCase().includes(v) ? "block" : "none";
    });
});

/* CURSOR */
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";

    const t = document.createElement("div");
    t.className = "trail";
    t.style.left = e.clientX + "px";
    t.style.top = e.clientY + "px";
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 600);
});

document.addEventListener("click", (e) => {
    const r = document.createElement("div");
    r.className = "ripple";
    r.style.left = e.clientX + "px";
    r.style.top = e.clientY + "px";
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 600);
});

/* PARTICLES */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let p = [];

for (let i = 0; i < 80; i++) {
    p.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        s: Math.random()*2,
        vx: (Math.random()-0.5)*0.4,
        vy: (Math.random()-0.5)*0.4
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    p.forEach(a=>{
        a.x += a.vx;
        a.y += a.vy;

        if(a.x<0)a.x=canvas.width;
        if(a.x>canvas.width)a.x=0;
        if(a.y<0)a.y=canvas.height;
        if(a.y>canvas.height)a.y=0;

        ctx.fillStyle="rgba(123,91,255,0.6)";
        ctx.beginPath();
        ctx.arc(a.x,a.y,a.s,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}
animate();
</script>
